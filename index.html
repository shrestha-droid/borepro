<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Secure Storage</title>
    <script src="https://unpkg.com/secrets.js-grempe@2.0.0/secrets.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #f4f7f6;
            --bg-panel: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-light: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --log-bg: #f8fafc;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard {
            width: 100%;
            max-width: 850px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"], input[type="number"] {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input[type="file"] {
            background: var(--log-bg);
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            color: var(--text-light);
            padding: 16px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .actions {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        button {
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            flex: 1;
            transition: background 0.2s ease;
        }

        button.secondary {
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        button:hover { background: var(--accent-hover); }
        button.secondary:hover { background: var(--log-bg); }

        .log-panel {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--log-bg);
            overflow: hidden;
        }

        .log-header {
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            background: #ffffff;
        }

        #activity-feed {
            padding: 16px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .status-normal { color: var(--text-light); }
        .status-success { color: #16a34a; font-weight: 500; }
        .status-error { color: #dc2626; font-weight: 500; }
        
        #activity-feed::-webkit-scrollbar { width: 6px; }
        #activity-feed::-webkit-scrollbar-track { background: transparent; }
        #activity-feed::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Distributed Storage Gateway</h1>
        <p class="subtitle">Securely split and distribute files across the backend network.</p>
        
        <div class="grid">
            <div class="input-group">
                <label>File or Project Name</label>
                <input type="text" id="keyId" placeholder="e.g., final_report" autocomplete="off">
            </div>
            
            <div class="input-group full-width">
                <label>Secret Message (Leave blank if uploading a file)</label>
                <input type="text" id="secret" placeholder="Type a message to secure..." autocomplete="off">
            </div>

            <div class="input-group full-width">
                <label>Upload File <span id="file-status" style="color:var(--text-light); font-weight:normal; font-size: 0.8rem;">(Max size: 400KB)</span></label>
                <input type="file" id="fileInput" onchange="checkFileSize()">
            </div>

            <div class="input-group">
                <label>Total Servers to Use</label>
                <input type="number" id="totalNodes" value="5" min="2" max="10">
            </div>

            <div class="input-group">
                <label>Minimum Servers to Unlock</label>
                <input type="number" id="threshold" value="3" min="2" max="10">
            </div>
        </div>

        <div class="actions">
            <button onclick="encryptData()">Split & Send to Servers</button>
            <button class="secondary" onclick="decryptData()">Retrieve & Unlock</button>
        </div>

        <div class="log-panel">
            <div class="log-header">Activity Feed</div>
            <div id="activity-feed">
                <span class="status-normal">System ready. Waiting for input...</span><br>
            </div>
        </div>
    </div>

    <script>
        function logActivity(message, type="normal") {
            const feed = document.getElementById('activity-feed');
            let cssClass = "status-normal";
            if (type === "success") cssClass = "status-success";
            if (type === "error") cssClass = "status-error";
            
            feed.innerHTML += `<span class="${cssClass}">${message}</span><br>`;
            feed.scrollTop = feed.scrollHeight;
        }

        function checkFileSize() {
            const fileInput = document.getElementById('fileInput');
            const statusText = document.getElementById('file-status');
            
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileSizeKB = (file.size / 1024).toFixed(1);
                
                if (file.size > 400000) {
                    statusText.innerHTML = `(File too large: ${fileSizeKB}KB - Please keep under 400KB)`;
                    statusText.style.color = "#dc2626";
                    fileInput.value = ""; 
                    logActivity(`Upload blocked. The file is too large to process in the browser.`, "error");
                } else {
                    statusText.innerHTML = `(Ready: ${fileSizeKB}KB)`;
                    statusText.style.color = "#16a34a";
                    logActivity(`File attached successfully.`, "normal");
                }
            } else {
                statusText.innerHTML = `(Max size: 400KB)`;
                statusText.style.color = "var(--text-light)";
            }
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function encryptData() {
            const keyId = document.getElementById('keyId').value;
            const secretText = document.getElementById('secret').value;
            const fileInput = document.getElementById('fileInput').files[0];
            const totalNodes = parseInt(document.getElementById('totalNodes').value);
            const threshold = parseInt(document.getElementById('threshold').value);

            if (!keyId) return logActivity("Please enter a File or Project Name.", "error");
            if (!secretText && !fileInput) return logActivity("Please enter a message or upload a file.", "error");
            if (threshold > totalNodes) return logActivity("Minimum servers cannot be greater than total servers.", "error");

            logActivity("<br>--- Starting New Process ---", "normal");
            logActivity(`Preparing to secure data for: ${keyId}`, "normal");

            let finalPayload = "";

            try {
                if (fileInput) {
                    if (fileInput.size > 400000) return logActivity(`File is too large.`, "error");
                    logActivity(`Converting file format...`, "normal");
                    finalPayload = await readFileAsBase64(fileInput);
                } else {
                    finalPayload = secretText;
                }
                
                logActivity(`Splitting data into ${totalNodes} secure pieces...`, "normal");

                const secretHex = secrets.str2hex(finalPayload);
                const shares = secrets.share(secretHex, totalNodes, threshold);

                // --- GROUP API INTEGRATION: SEND PAYLOAD ---
                logActivity(`Connecting to backend servers...`, "normal");

                try {
                    const response = await fetch('http://localhost:5000/api/encrypt', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            key_id: keyId,
                            total_nodes: totalNodes,
                            threshold: threshold,
                            shards: shares
                        })
                    });

                    if (!response.ok) throw new Error(`Server returned status ${response.status}`);
                    logActivity(`Success: Data safely distributed across the backend network!`, "success");

                } catch (networkError) {
                    logActivity(`Backend offline. Activating offline safety mode...`, "error");
                    // Fallback to local storage if the group's server crashes
                    localStorage.setItem(keyId, JSON.stringify(shares));
                    logActivity(`Data saved locally to ensure the demo continues.`, "success");
                }
                // -------------------------------------------
                
                // Clear UI on success
                document.getElementById('secret').value = ''; 
                document.getElementById('fileInput').value = ''; 
                document.getElementById('file-status').innerHTML = `(Max size: 400KB)`;
                document.getElementById('file-status').style.color = "var(--text-light)";

            } catch (error) {
                logActivity(`Processing error: ${error.message}`, "error");
            }
        }

        async function decryptData() {
            const keyId = document.getElementById('keyId').value;
            const threshold = parseInt(document.getElementById('threshold').value);

            if (!keyId) return logActivity("Please enter the File Name to retrieve.", "error");
            
            logActivity("<br>--- Starting Retrieval Process ---", "normal");
            
            // --- GROUP API INTEGRATION: FETCH PAYLOAD ---
            logActivity(`Requesting data pieces from backend servers...`, "normal");
            let localMemory;

            try {
                const response = await fetch(`http://localhost:5000/api/decrypt/${keyId}`);
                if (!response.ok) throw new Error("Could not find data on servers.");
                
                const serverData = await response.json();
                localMemory = serverData.shards; 
                logActivity(`Data pieces retrieved successfully.`, "success");

            } catch (networkError) {
                logActivity(`Backend offline. Checking local storage...`, "error");
                const storedData = localStorage.getItem(keyId);
                if (!storedData) return logActivity(`Could not find this file anywhere.`, "error");
                localMemory = JSON.parse(storedData);
                logActivity(`Found data pieces locally.`, "success");
            }
            // -------------------------------------------

            setTimeout(() => {
                logActivity(`Combining pieces to unlock the data...`, "normal");
                
                try {
                    const retrievedShares = localMemory.slice(0, threshold);
                    const combinedHex = secrets.combine(retrievedShares);
                    const originalPayload = secrets.hex2str(combinedHex);
                    
                    if (originalPayload.startsWith('data:')) {
                        logActivity(`File unlocked successfully!`, "success");
                        const downloadLink = `<a href="${originalPayload}" download="decrypted_${keyId}" style="color:#2563eb; text-decoration:underline; font-weight:600;">Download Unlocked File</a>`;
                        logActivity(downloadLink, "normal");
                    } else {
                        logActivity(`Message unlocked successfully:`, "success");
                        logActivity(`Message: "${originalPayload}"`, "normal");
                    }

                } catch (error) {
                    logActivity(`Failed to combine pieces: ${error.message}`, "error");
                }
            }, 600);
        }
    </script>
</body>
</html>
